name: Test review

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

on:
  pull_request:
    branches:
      - master
    types: ["review_requested", "synchronize", "opened", "reopened"]
  pull_request_review:
    types:
      - submitted
      - dismissed

jobs:
  test-post-review-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - id: review
        uses: ./post-review-status
        with:
          pull-request: ${{ github.event.pull_request.number }}
          owner: ${{ github.repository_owner }}
          repo: github-actions
  test-post-status-check-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - id: security-review
        uses: ./post-review-status
        with:
          pull-request: ${{ github.event.pull_request.number }}
          owner: ${{ github.repository_owner }}
          repo: github-actions
          context: github-actions/important-feature-branch
