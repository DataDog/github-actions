name: "Test actions"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master

jobs:
  license-3rdparty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: "12"
      - run: npm i
      - run: npm run check-licenses
